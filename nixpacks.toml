# Coolify / Nixpacks — Filament admin does not need Vite frontend build.
# Skipping npm avoids Node 18 + @tailwindcss/oxide native binding failures.

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs",
]

[phases.build]
cmds = [
    "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache storage/app/public",
    "chmod -R 775 storage bootstrap/cache",
    "php artisan filament:upgrade || true",
]
